services:
  data-init:
    image: alpine:3.22
    user: "0:0"
    volumes:
      - ${AI_FACTORY_DATA_ROOT:-/srv/ai-factory}:/srv/ai-factory
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p \
          /srv/ai-factory/discovery-assembly-staging \
          /srv/ai-factory/discovery-assembly-output
        chown 1001:1001 \
          /srv/ai-factory/discovery-assembly-staging \
          /srv/ai-factory/discovery-assembly-output
        chmod 0770 \
          /srv/ai-factory/discovery-assembly-staging \
          /srv/ai-factory/discovery-assembly-output
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: video-factory-app:latest
    env_file:
      - ${AI_FACTORY_ENV_FILE:-/opt/ai-factory/.env}
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      NODE_ENV: production
      AI_FACTORY_DATA_ROOT: /srv/ai-factory
      GOOGLE_DRIVE_AUTH_MODE: oauth_user
    volumes:
      - ${AI_FACTORY_DATA_ROOT:-/srv/ai-factory}:/srv/ai-factory
    depends_on:
      data-init:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: video-factory-worker:latest
    env_file:
      - ${AI_FACTORY_ENV_FILE:-/opt/ai-factory/.env}
    environment:
      NODE_ENV: production
      AI_FACTORY_DATA_ROOT: /srv/ai-factory
      BUILD_SHA: ${DEPLOY_COMMIT:-local}
      GOOGLE_DRIVE_AUTH_MODE: oauth_user
      ORCHESTRATOR_QUEUE_MODE: core
      WORKER_CONCURRENCY: "1"
    volumes:
      - ${AI_FACTORY_DATA_ROOT:-/srv/ai-factory}:/srv/ai-factory
    depends_on:
      data-init:
        condition: service_completed_successfully
    restart: unless-stopped

  research-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: video-factory-worker:latest
    env_file:
      - ${AI_FACTORY_ENV_FILE:-/opt/ai-factory/.env}
    environment:
      NODE_ENV: production
      AI_FACTORY_DATA_ROOT: /srv/ai-factory
      BUILD_SHA: ${DEPLOY_COMMIT:-local}
      ORCHESTRATOR_QUEUE_MODE: research
      WORKER_CONCURRENCY: "5"
    volumes:
      - ${AI_FACTORY_DATA_ROOT:-/srv/ai-factory}:/srv/ai-factory
    depends_on:
      data-init:
        condition: service_completed_successfully
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
