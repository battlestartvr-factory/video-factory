name: Deploy Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Resolve deploy commit
        id: commit
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            echo "sha=${WORKFLOW_RUN_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${MANUAL_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail

          if [[ -z "${DEPLOY_HOST:-}" || -z "${DEPLOY_USER:-}" ]]; then
            echo "DEPLOY_HOST and DEPLOY_USER secrets are required." >&2
            exit 1
          fi

          if [[ -z "${DEPLOY_SSH_KEY_B64:-}" && -z "${DEPLOY_SSH_KEY:-}" ]]; then
            echo "Set DEPLOY_SSH_KEY_B64 (recommended) or DEPLOY_SSH_KEY." >&2
            exit 1
          fi

          install -m 700 -d ~/.ssh

          if [[ -n "${DEPLOY_SSH_KEY_B64:-}" ]]; then
            printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 --decode > ~/.ssh/deploy_key
          else
            printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key

          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "The deploy SSH secret is not a valid OpenSSH private key." >&2
            echo "Use DEPLOY_SSH_KEY_B64 to preserve the key exactly." >&2
            exit 1
          fi

          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd /opt/ai-factory/app && git reset --hard HEAD && /opt/ai-factory/app/scripts/deploy.sh ${DEPLOY_COMMIT}"
