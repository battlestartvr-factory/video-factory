name: Production Diagnostics PR

on:
  pull_request:
    branches:
      - fix-inline-prototype-and-production-502

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prepare SSH key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          [[ -n "${DEPLOY_HOST:-}" && -n "${DEPLOY_USER:-}" ]] || { echo "DEPLOY_HOST and DEPLOY_USER are required" >&2; exit 1; }
          [[ -n "${DEPLOY_SSH_KEY_B64:-}" || -n "${DEPLOY_SSH_KEY:-}" ]] || { echo "Deploy SSH key is required" >&2; exit 1; }
          install -m 700 -d ~/.ssh
          if [[ -n "${DEPLOY_SSH_KEY_B64:-}" ]]; then
            printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 --decode > ~/.ssh/deploy_key
          else
            printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null

      - name: Collect production diagnostics
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set +e
          cd /opt/ai-factory/app || exit 2
          echo '=== TIME ==='
          date -u
          echo '=== GIT ==='
          git rev-parse HEAD
          echo '=== COMPOSE PS ==='
          docker compose ps
          echo '=== CADDY -> APP HEALTH ==='
          docker compose exec -T caddy wget -S -O- http://app:3000/api/health 2>&1
          echo '=== PRIMARY HOST RECENT ==='
          docker compose logs --since=4h caddy 2>&1 | grep -F 'battlestart-factory.duckdns.org' | tail -40
          echo '=== VR ALIAS RECENT ==='
          docker compose logs --since=4h caddy 2>&1 | grep -F 'battlestartvr-factory.duckdns.org' | tail -40
          echo '=== 502 RECENT ==='
          docker compose logs --since=4h caddy 2>&1 | grep -E 'status[^0-9]*502|status":502|status": 502' | tail -60
          REMOTE
