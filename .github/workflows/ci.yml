name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
      MOCK_WORKFLOWS: "true"
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: bash -n scripts/deploy.sh scripts/check-schema-contract.sh scripts/check-google-drive-oauth.sh

      - run: bash scripts/check-schema-contract.sh

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm exec tsc -p tsconfig.worker.json

      - name: Build durable worker image
        run: docker build --file Dockerfile.worker --tag video-factory-worker:ci .

      - name: Verify FFmpeg assembly runtime
        run: |
          docker run --rm --entrypoint ffmpeg video-factory-worker:ci -version
          docker run --rm --entrypoint ffprobe video-factory-worker:ci -version

      - name: Unit tests shard 1 of 4
        run: pnpm exec vitest run --shard=1/4

      - name: Unit tests shard 2 of 4
        run: pnpm exec vitest run --shard=2/4

      - name: Unit tests shard 3 of 4
        run: pnpm exec vitest run --shard=3/4

      - name: Unit tests shard 4 of 4
        run: pnpm exec vitest run --shard=4/4

      - run: pnpm build
