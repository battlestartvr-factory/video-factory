name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
      MOCK_WORKFLOWS: "true"
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Diagnose complete unit suite
        shell: bash
        run: |
          set +e
          pnpm test -- --reporter=verbose 2>&1 | tee vitest-full.log
          printf '%s\n' "${PIPESTATUS[0]}" > vitest-full.status
          exit 0

      - name: Upload full test diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: vitest-full-log
          path: |
            vitest-full.log
            vitest-full.status

      - name: Assert unit suite passed
        run: test "$(cat vitest-full.status)" = "0"
