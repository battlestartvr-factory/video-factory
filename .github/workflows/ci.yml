name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
      MOCK_WORKFLOWS: "true"
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Diagnose unit-test shard 2 of 4
        shell: bash
        run: |
          set +e
          pnpm exec vitest run --shard=2/4 --reporter=verbose 2>&1 | tee vitest-shard2.log
          printf '%s\n' "${PIPESTATUS[0]}" > vitest-shard2.status
          exit 0

      - name: Upload shard 2 diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: vitest-shard2-log
          path: |
            vitest-shard2.log
            vitest-shard2.status

      - name: Assert shard 2 passed
        run: test "$(cat vitest-shard2.status)" = "0"
